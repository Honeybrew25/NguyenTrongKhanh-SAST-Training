[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulngym-enrich"
version = "0.1.0"
description = "Reproducible VulnGym enrichment and finding-verification benchmark"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "pyyaml==6.0.2",
  "pytest>=9,<10",
]

[project.scripts]
vulngym-audit = "vulngym_enrich.audit:main"
vulngym-checkout = "vulngym_enrich.checkout:main"
vulngym-dedup = "vulngym_enrich.dedup:main"
vulngym-evaluate = "vulngym_enrich.evaluator:main"
vulngym-full-pipeline = "vulngym_enrich.full_pipeline:main"
vulngym-match = "vulngym_enrich.candidate_matcher:main"
vulngym-normalize = "vulngym_enrich.normalizer:main"
vulngym-opengrep-release = "vulngym_enrich.opengrep_release:main"
vulngym-rules = "vulngym_enrich.rule_inventory:main"
vulngym-scan = "vulngym_enrich.scanner:main"
vulngym-verify-agent = "vulngym_enrich.verifier_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulngym_enrich"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
